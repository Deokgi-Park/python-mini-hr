<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Python Mini HR{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Python Mini HR</h1>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">직원 목록</a></li>
                <li><a href="{{ url_for('add_employee') }}" class="btn-add">직원 추가</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Python Mini HR. 개인용 인사 관리 시스템</p>
        </div>
    </footer>
</body>
</html>
